apiVersion: v1
kind: ConfigMap
metadata:
  name: hashchat-config
  namespace: hashchat
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://hashchat-postgres:5432/hashchat"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATA_REDIS_HOST: "hashchat-redis"
  HASHCHAT_CORS_ALLOWED_ORIGINS: "https://hashchat.example.com"
  HASHCHAT_ATTACHMENTS_STORAGE_PATH: "/app/attachments"
  VAPID_PUBLIC_KEY: ""
  # Kafka is expected to be provided by Strimzi/Redpanda/MSK/etc. in production.
  KAFKA_BOOTSTRAP_SERVERS: "hashchat-kafka-bootstrap:9092"
  HASHCHAT_KAFKA_CONSUMER_GROUP: "hashchat-workers"
  # Shared across all backend pods. Redis pub/sub fans the event out to the pod that owns the socket.
  HASHCHAT_KAFKA_REALTIME_GROUP_ID: "hashchat-realtime"
  HASHCHAT_KAFKA_TOPIC_REPLICAS: "3"
  HIKARI_MAX_POOL_SIZE: "4"
