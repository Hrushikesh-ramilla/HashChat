apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hashchat-backend
  namespace: hashchat
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hashchat-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hashchat-frontend
  namespace: hashchat
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hashchat-frontend
