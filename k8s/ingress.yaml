apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hashchat-ingress
  namespace: hashchat
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hashchat.example.com
      secretName: hashchat-tls
  rules:
    - host: hashchat.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hashchat-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: hashchat-backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: hashchat-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hashchat-frontend
                port:
                  number: 80
