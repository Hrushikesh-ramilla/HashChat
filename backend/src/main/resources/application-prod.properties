# Production profile
# Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Required env vars:
# JWT_SECRET: random 32+ character string
# HASHCHAT_CORS_ALLOWED_ORIGINS: exact frontend origin, e.g. https://app.example.com
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT

# Expose health, info, and prometheus metrics for Grafana
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.server.port=9091

server.error.include-message=never

# Logging level
logging.level.com.hashchat.messenger=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=WARN

# Swagger disabled in prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Security
hashchat.security.public-docs-enabled=false
hashchat.security.public-prometheus-enabled=false

# Demo mode (opt-in: set HASHCHAT_DEMO_ENABLED=true to enable /api/demo/seed)
hashchat.demo.enabled=${HASHCHAT_DEMO_ENABLED:false}

# Kafka / outbox
# KAFKA_BOOTSTRAP_SERVERS is mandatory when HASHCHAT_KAFKA_ENABLED=true.
hashchat.kafka.enabled=${HASHCHAT_KAFKA_ENABLED:false}
hashchat.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
hashchat.kafka.topic.replicas=${HASHCHAT_KAFKA_TOPIC_REPLICAS:3}

# Reverse-proxy awareness and hardened refresh cookie
server.forward-headers-strategy=framework
hashchat.auth.refresh-cookie-same-site=Strict

# Keep the per-pod pool small: HPA can run many replicas against one primary.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:4}
